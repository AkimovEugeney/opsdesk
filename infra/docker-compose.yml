services:
  postgres:
    image: postgres:16-alpine
    container_name: opsdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - opsdesk-postgres-data:/var/lib/postgresql/data

volumes:
  opsdesk-postgres-data:
